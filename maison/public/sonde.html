<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonde tablette</title>
<!--
  Page volontairement écrite en ES5, sans build, sans dépendance, sans module.
  C'est le seul fichier du projet qui doit s'afficher même si tout le reste
  échoue : elle sert à savoir ce que la tablette sait vraiment faire, avant
  d'aller déboguer une page blanche sans outils.
-->
<style>
  body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         margin: 0; padding: 16px; background: #fff; color: #111; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: #666; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em;
       color: #666; margin: 22px 0 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td { padding: 5px 8px; border-bottom: 1px solid #eee; vertical-align: top; }
  td.k { color: #444; }
  td.v { text-align: right; white-space: nowrap; font-weight: 700; }
  .ok { color: #15803d; }
  .no { color: #b91c1c; }
  pre { background: #f5f5f5; padding: 10px; overflow-x: auto; font-size: 11px;
        white-space: pre-wrap; word-break: break-all; margin: 0; }
</style>
</head>
<body>
<h1>Sonde tablette</h1>
<p class="sub">Ce que ce navigateur sait faire. Photographie cet écran.</p>

<h2>Navigateur</h2>
<pre id="ua"></pre>
<table id="env"></table>

<h2>JavaScript</h2>
<table id="js"></table>

<h2>CSS</h2>
<table id="css"></table>

<h2>API</h2>
<table id="api"></table>

<script>
(function () {
  'use strict';

  function syntaxOk(src) {
    try { /* jshint evil:true */ (0, eval)(src); return true; }
    catch (e) { return false; }
  }

  function cssOk(prop, value) {
    if (!window.CSS || !window.CSS.supports) return false;
    try { return window.CSS.supports(prop, value); } catch (e) { return false; }
  }

  function selectorOk(sel) {
    if (!window.CSS || !window.CSS.supports) return false;
    try { return window.CSS.supports('selector(' + sel + ')'); } catch (e) { return false; }
  }

  function render(id, rows) {
    var table = document.getElementById(id);
    var html = '';
    for (var i = 0; i < rows.length; i++) {
      var value = rows[i][1];
      var cls = '';
      if (value === true) { value = 'oui'; cls = ' class="ok"'; }
      else if (value === false) { value = 'non'; cls = ' class="no"'; }
      html += '<tr><td class="k">' + rows[i][0] + '</td><td class="v"' + cls + '>' + value + '</td></tr>';
    }
    table.innerHTML = html;
  }

  document.getElementById('ua').textContent = navigator.userAgent;

  render('env', [
    ['Écran (px CSS)', window.screen.width + ' × ' + window.screen.height],
    ['Fenêtre', window.innerWidth + ' × ' + window.innerHeight],
    ['devicePixelRatio', window.devicePixelRatio || 1],
    ['Langue', navigator.language],
    ['Tactile', 'ontouchstart' in window]
  ]);

  // Chaque test évalue une chaîne : la syntaxe moderne n'est jamais analysée
  // par le parseur de cette page, seulement par eval. Un vieux moteur lève
  // une SyntaxError au lieu de refuser de charger le fichier entier.
  render('js', [
    ['Fonctions fléchées', syntaxOk('(() => 1)')],
    ['let / const', syntaxOk('(function(){ "use strict"; let a = 1; const b = 2; return a + b; })')],
    ['Gabarits `...`', syntaxOk('(function(){ return `x`; })')],
    ['async / await', syntaxOk('(async function(){ await 0; })')],
    ['Optional chaining ?.', syntaxOk('(function(){ var o = {}; return o?.a; })')],
    ['Coalescence ??', syntaxOk('(function(){ return null ?? 1; })')],
    ['Spread objet', syntaxOk('(function(){ return { ...{a: 1} }; })')],
    ['Array.prototype.at', typeof Array.prototype.at === 'function'],
    ['Object.hasOwn', typeof Object.hasOwn === 'function'],
    ['structuredClone', typeof window.structuredClone === 'function'],
    ['Promise', typeof window.Promise === 'function'],
    ['Intl.DateTimeFormat', typeof window.Intl === 'object' && typeof Intl.DateTimeFormat === 'function']
  ]);

  render('css', [
    ['Variables CSS', cssOk('--x', '1px')],
    ['Flexbox', cssOk('display', 'flex')],
    ['Grid', cssOk('display', 'grid')],
    ['gap sur flex', cssOk('gap', '1px')],
    ['aspect-ratio', cssOk('aspect-ratio', '1 / 1')],
    ['color-mix()', cssOk('color', 'color-mix(in srgb, red 50%, blue)')],
    ['oklch()', cssOk('color', 'oklch(0.5 0.1 200)')],
    ['sélecteur :has()', selectorOk(':has(*)')],
    ['position: sticky', cssOk('position', 'sticky')],
    ['env(safe-area-inset-top)', cssOk('padding-top', 'env(safe-area-inset-top)')]
  ]);

  render('api', [
    ['fetch', typeof window.fetch === 'function'],
    ['navigator.wakeLock', !!(navigator.wakeLock && navigator.wakeLock.request)],
    ['visibilitychange', typeof document.hidden === 'boolean'],
    ['localStorage', (function () {
      try { window.localStorage.setItem('_s', '1'); window.localStorage.removeItem('_s'); return true; }
      catch (e) { return false; }
    })()],
    ['requestAnimationFrame', typeof window.requestAnimationFrame === 'function']
  ]);

  // Le point le plus utile : la tablette parle-t-elle vraiment à l'API ?
  var apiRow = document.createElement('tr');
  apiRow.innerHTML = '<td class="k">Appel /api/health</td><td class="v">…</td>';
  document.getElementById('api').appendChild(apiRow);
  if (typeof window.fetch === 'function') {
    window.fetch('/api/health').then(function (r) {
      apiRow.lastChild.className = r.ok ? 'v ok' : 'v no';
      apiRow.lastChild.textContent = 'HTTP ' + r.status;
    })['catch'](function (e) {
      apiRow.lastChild.className = 'v no';
      apiRow.lastChild.textContent = 'échec';
    });
  } else {
    apiRow.lastChild.className = 'v no';
    apiRow.lastChild.textContent = 'pas de fetch';
  }
})();
</script>
</body>
</html>
