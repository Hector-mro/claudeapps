name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: todo-app/package-lock.json

      - name: Install todo-app dependencies
        working-directory: todo-app
        run: npm ci

      - name: Build todo-app
        working-directory: todo-app
        run: npm run build

      # Static apps (undercover/, chess-coords/) are copied through as-is —
      # they have no build step. maison/ is excluded: it deploys separately
      # to Cloudflare, per README.md.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r undercover _site/undercover
          cp -r chess-coords _site/chess-coords
          mkdir -p _site/todo-app
          cp -r todo-app/dist/. _site/todo-app/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
